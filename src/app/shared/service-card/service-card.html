
<section class="wash-services" aria-labelledby="services-title">
  <div class="services-container">
    <header class="services-header">
      <p class="eyebrow">99WASH LAUNDRY & DRY CLEANING</p>

      <h2 id="services-title">Our Premium Laundry Services</h2>

      <span class="heading-accent" aria-hidden="true"></span>

      <p class="services-subtitle">
        Expert garment care, convenient doorstep pickup and delivery across
        Mumbai and Navi Mumbai.
      </p>
    </header>

    <div class="services-grid">
      <!-- Steam Iron -->
      <article class="service-card" *ngFor="let card of services">
        <div class="service-icon service-icon-wrapper" aria-hidden="true">
          <img [src]="card.image" alt="{{card.title}}">
        </div>

        <h3>{{card.title}}</h3>
        <p>{{card.description}}</p>

        <strong class="service-price">Starts ₹{{card.price}}<span>/{{card.unit}}</span></strong>

        <div class="service-actions">
          <a [routerLink]="['/services']" fragment="{{card.link}}" class="rate-link">View Rate List</a>
          <a (click)="bookPickupForm.openPopup()" class="book-button">Book Now</a>
        </div>
      </article>
    </div>
  </div>
</section>
<app-book-pick-up-form></app-book-pick-up-form>
